name: v6 question and browser checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python build_merged_questions.py
      - run: python verify_questions.py
      - run: python audit_word_coverage.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: git diff --exit-code -- questions.json questions-data.js question-build-report.json word-coverage-report.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
